name: Build Annapurna v1.4.425 Marriage Clean Report APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v425-marriage-clean-verdicts.yml'
      - 'Annapurna-Astro-Vastu-v1.4.425-Marriage-Report-Clean-Verdicts-FULL.zip'

permissions:
  contents: read

concurrency:
  group: annapurna-v425-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v425:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout v425 source archive only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Annapurna-Astro-Vastu-v1.4.425-Marriage-Report-Clean-Verdicts-FULL.zip
          sparse-checkout-cone-mode: false

      - name: Verify archive and extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, zipfile

          source = Path('Annapurna-Astro-Vastu-v1.4.425-Marriage-Report-Clean-Verdicts-FULL.zip')
          assert source.is_file(), 'v425 source ZIP missing from repository root'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '3f6c6777a8891a04ac38e501c3847eb489da097732732a2c345fcd1c8adf024a', 'v425 source ZIP checksum mismatch'
          target = Path(os.environ['RUNNER_TEMP']) / 'annapurna_v425'
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None, 'ZIP CRC error'
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  assert p.parts and not p.is_absolute() and '..' not in p.parts, info.filename
                  assert p.parts[0] == 'astro_app' or info.filename.startswith('README-'), info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16), info.filename
              z.extractall(target)
          app = target / 'astro_app'
          assert 'version: 1.4.425+425' in (app / 'pubspec.yaml').read_text()
          for name in [
              'lib/screens/chart_screen.dart',
              'lib/services/marriage_pdf_report_service.dart',
              'lib/astrology/marriage_verdict_text_v425.dart',
              'test/marriage_verdict_text_v425_test.dart',
              'test/marriage_matching_four_charts_v424_test.dart',
              'android/app/annapurna-build11.jks',
          ]:
              assert (app / name).is_file(), f'Missing {name}'
          print('v425 source archive verified')
          PY_VERIFY

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter packages
        working-directory: ${{ runner.temp }}/annapurna_v425/astro_app
        run: flutter pub get

      - name: Test matching verdicts, PDF, UI and regressions
        working-directory: ${{ runner.temp }}/annapurna_v425/astro_app
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            test/marriage_verdict_text_v425_test.dart \
            test/marriage_matching_four_charts_v424_test.dart \
            test/marriage_rule_first_v422_test.dart \
            test/marriage_four_chart_audit_v420_test.dart \
            test/marriage_chrome_if_then_test.dart \
            test/marriage_material_registry_test.dart \
            test/home_kp_jamakola_v423_test.dart \
            test/career_options_card_v394_test.dart

      - name: Build installable APK
        working-directory: ${{ runner.temp }}/annapurna_v425/astro_app
        run: flutter build apk --release --no-pub

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.425-Marriage-Clean-Report-APK
          path: ${{ runner.temp }}/annapurna_v425/astro_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
