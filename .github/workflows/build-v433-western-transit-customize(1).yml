name: Build Annapurna v1.4.433 Western Transit Customize APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v433-western-transit-customize.yml'
      - 'Annapurna-Astro-Vastu-v1.4.433-Western-Transit-Customize-FULL.zip'

permissions:
  contents: read

concurrency:
  group: annapurna-v433-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v433:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source ZIP
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Annapurna-Astro-Vastu-v1.4.433-Western-Transit-Customize-FULL.zip
          sparse-checkout-cone-mode: false

      - name: Verify checksum and unpack full source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, zipfile
          source=Path('Annapurna-Astro-Vastu-v1.4.433-Western-Transit-Customize-FULL.zip')
          assert source.is_file(), 'v433 source ZIP missing'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '85b86c7b4e00851de17cb6905cf95e8496014aec7d0e274e538df496c44757e3', 'Source hash mismatch'
          target=Path(os.environ['RUNNER_TEMP'])/'annapurna_v433'
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None, 'ZIP integrity failure'
              for member in archive.infolist():
                  p=PurePosixPath(member.filename)
                  assert p.parts and not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] == 'astro_app' and not stat.S_ISLNK(member.external_attr>>16)
              archive.extractall(target)
          root=target/'astro_app'
          assert 'version: 1.4.433+433' in (root/'pubspec.yaml').read_text()
          for f in ('lib/astrology/western_timing_settings_v433.dart',
                    'lib/screens/western_timing_tab.dart',
                    'test/western_timing_settings_v433_test.dart',
                    'lib/screens/rule_inspection_highlight_v432.dart',
                    'test/rule_inspection_blue_only_v432_test.dart'):
              assert (root/f).is_file(), f
          print('v433 source hash and manifest verified')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter dependencies
        working-directory: ${{ runner.temp }}/annapurna_v433/astro_app
        run: flutter pub get

      - name: Run Western and existing regression tests
        working-directory: ${{ runner.temp }}/annapurna_v433/astro_app
        run: |
          flutter test --no-pub --reporter expanded \
            test/western_timing_settings_v433_test.dart \
            test/rule_inspection_blue_only_v432_test.dart \
            test/jamakola_compact_review_v428_test.dart \
            test/jamakola_result_order_v429_test.dart \
            test/jamakola_kavippu_auto_contact_v430_test.dart \
            test/jamakola_topic_isolation_v429_test.dart \
            test/jamakola_pending_group_v427_test.dart \
            test/jamakola_rule_facts_test.dart \
            test/question_place_default_v426_test.dart \
            test/home_kp_jamakola_v423_test.dart \
            test/place_storage_service_test.dart \
            test/topic_inspection_headline_v431_test.dart \
            test/topic_result_card_v391_test.dart \
            test/topic_varga_review_panel_test.dart \
            test/topic_results_v398_test.dart \
            test/marriage_four_chart_audit_v420_test.dart \
            test/career_options_card_v394_test.dart \
            test/wealth_topic_v409_test.dart

      - name: Build signed release APK
        working-directory: ${{ runner.temp }}/annapurna_v433/astro_app
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.433-Western-Transit-Customize-APK
          path: ${{ runner.temp }}/annapurna_v433/astro_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
