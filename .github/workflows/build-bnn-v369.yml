              original_names = original.namelist()
              assert len(original_names)==len(set(original_names))
              assert re.search(r'^version:\s*1\.4\.368\+368\s*$',
                  original.read('astro_app/pubspec.yaml').decode(),re.M)
              for info in original.infolist():
                  p = PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr>>16)
                  output.writestr(info, update.pop(info.filename,original.read(info.filename)))
              for p,data in sorted(update.items()):
                  path = PurePosixPath(p)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in p
                  output.writestr(p,data)
          with ZipFile(target) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(set(z.namelist()))
              assert re.search(r'^version:\s*1\.4\.369\+369\s*$',
                  z.read('astro_app/pubspec.yaml').decode(),re.M)
              data=json.loads(z.read('astro_app/assets/life_events/life_event_review_catalog_v369.json'))
              assert len(data['events'])==28
              assert 'type:MaterialType.transparency' in z.read('astro_app/lib/screens/bnn_cycle_result_card.dart').decode()
              app=Path(os.environ['RUNNER_TEMP'])/'annapurna_v369'
              z.extractall(app)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'APP_DIR={app / "astro_app"}\n')
          print('Applied source overlay, reviewed 28 life events; v369 ZIP integrity PASS')
          PY

      - name: Upload Full Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.369-FULL-SOURCE
          path: Annapurna-Astro-Vastu-v1.4.369-BNN-Life-Events-Phase1-FULL.zip
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter packages
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Run Life Events and existing BNN regression tests
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            test/bnn_life_event_timing_v369_test.dart \
            test/bnn_jupiter_cycle_v355_test.dart \
            test/bnn_cycle_contact_results_v357_test.dart \
            test/bnn_cycle_result_highlight_v358_test.dart \
            test/bnn_planet_combinations_v359_test.dart \
            test/bnn_health_caution_v363_test.dart \
            test/bnn_mrityunjaya_remedy_v364_test.dart \
            test/bnn_multi_planet_source_v367_test.dart \
            test/bnn_progression_source_priority_v368_test.dart

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            logfile="${RUNNER_TEMP}/bnn-v369-build-${attempt}.log"
            if flutter build apk --release --no-pub 2>&1 | tee "$logfile"; then
              echo 'Release APK successful'
              exit 0
            fi
            if ! grep -Eiq 'status code 403|403 Forbidden|Could not GET|Could not download|Read timed out|Connection reset|Temporary failure in name resolution|UnknownHostException' "$logfile"; then
              echo 'Non-transient build failure. Stop.'
              exit 1
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt*20))"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.369-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v369-Build-Diagnostics
          path: ${{ runner.temp }}/bnn-v369-build-*.log
          if-no-files-found: ignore
          retention-days: 14
