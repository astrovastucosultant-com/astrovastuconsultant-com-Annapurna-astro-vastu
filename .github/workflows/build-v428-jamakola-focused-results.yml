name: Build Annapurna v1.4.428 Jamakola Focused Results APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v428-jamakola-focused-results.yml'
      - 'Annapurna-Astro-Vastu-v1.4.428-Jamakola-Focused-Results-FULL.zip'

permissions:
  contents: read

concurrency:
  group: annapurna-v428-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v428:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Annapurna-Astro-Vastu-v1.4.428-Jamakola-Focused-Results-FULL.zip
          sparse-checkout-cone-mode: false

      - name: Verify source and extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          source = Path('Annapurna-Astro-Vastu-v1.4.428-Jamakola-Focused-Results-FULL.zip')
          assert source.is_file(), 'v428 FULL ZIP missing from repository root'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'ee894e2218a014168deed97bb02ae23f7b52f8f2c123e3148a64420e44d3585a', 'v427 ZIP checksum mismatch'
          dest = Path(os.environ['RUNNER_TEMP']) / 'annapurna_v428'
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None, 'Corrupted archive'
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  assert p.parts and not p.is_absolute() and '..' not in p.parts, f'Unsafe ZIP path {info.filename}'
                  assert p.parts[0] == 'astro_app' or info.filename.startswith('README-'), info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16), info.filename
              z.extractall(dest)
          app = dest / 'astro_app'
          assert 'version: 1.4.428+428' in (app / 'pubspec.yaml').read_text()
          for name in [
              'lib/screens/birth_details_screen.dart',
              'lib/screens/chart_screen.dart',
              'lib/screens/question_place_picker.dart',
              'lib/services/question_place_service.dart',
              'test/question_place_default_v426_test.dart',
              'test/jamakola_pending_group_v427_test.dart',
              'test/jamakola_compact_review_v428_test.dart',
              'lib/screens/jamakola_rule_panel.dart',
              'lib/astrology/jamakola_rule_engine.dart',
              'android/app/annapurna-build11.jks',
          ]:
              assert (app / name).is_file(), name
          print('v428 source checksum and files verified')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter dependencies
        working-directory: ${{ runner.temp }}/annapurna_v428/astro_app
        run: flutter pub get

      - name: Register in-memory SharedPreferencesAsync for storage tests
        working-directory: ${{ runner.temp }}/annapurna_v428/astro_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ASYNC_MOCK'
          from pathlib import Path

          pub = Path('pubspec.yaml')
          body = pub.read_text()
          needle = 'dev_dependencies:\n'
          assert body.count(needle) == 1
          assert 'shared_preferences_platform_interface:' not in body
          pub.write_text(body.replace(needle,
              'dev_dependencies:\n  shared_preferences_platform_interface: ^2.4.2\n', 1))

          imports = (
              "import 'package:shared_preferences_platform_interface/in_memory_shared_preferences_async.dart';\n"
              "import 'package:shared_preferences_platform_interface/shared_preferences_async_platform_interface.dart';\n"
          )
          mock_setup = '''  setUpAll(() {
              SharedPreferencesAsyncPlatform.instance = InMemorySharedPreferencesAsync.empty();
            });
            setUp(() async {
              SharedPreferences.setMockInitialValues({});
              await SharedPreferencesAsync().clear();
            });'''
          replacements = {
              'test/question_place_default_v426_test.dart':
                  '  setUp(() => SharedPreferences.setMockInitialValues({}));',
              'test/place_storage_service_test.dart':
                  '''  setUp(() {
              SharedPreferences.setMockInitialValues({});
            });''',
          }
          for filename, old in replacements.items():
              path = Path(filename)
              text = path.read_text()
              marker = "import 'package:shared_preferences/shared_preferences.dart';\n"
              assert text.count(marker) == 1, filename
              assert text.count(old) == 1, filename
              text = text.replace(marker, marker + imports, 1)
              path.write_text(text.replace(old, mock_setup, 1))
              print('Registered async preferences mock:', filename)
          PY_ASYNC_MOCK
          flutter pub get

      - name: Validate focused Jamakola UI and existing rules and navigation
        working-directory: ${{ runner.temp }}/annapurna_v428/astro_app
        run: |
          flutter test --no-pub --reporter expanded \
            test/jamakola_compact_review_v428_test.dart \
            test/jamakola_pending_group_v427_test.dart \
            test/jamakola_rule_facts_test.dart \
            test/question_place_default_v426_test.dart \
            test/home_kp_jamakola_v423_test.dart \
            test/place_storage_service_test.dart

      - name: Build signed release APK
        working-directory: ${{ runner.temp }}/annapurna_v428/astro_app
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.428-Jamakola-Focused-Results-APK
          path: ${{ runner.temp }}/annapurna_v428/astro_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
