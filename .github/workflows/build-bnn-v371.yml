          target=Path(os.environ['GITHUB_WORKSPACE'])/'Annapurna-Astro-Vastu-v1.4.371-BNN-Event-Convergence-FULL.zip'
          with ZipFile(target,'w',ZIP_DEFLATED,compresslevel=6) as out:
            for f in sorted(temp.rglob('*')):
              if f.is_file():
                name=f.relative_to(temp).as_posix()
                info=ZipInfo(name)
                info.compress_type=ZIP_DEFLATED
                info.external_attr=((0o100755 if name.endswith('/gradlew') else 0o100644)<<16)
                out.writestr(info, f.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=6)
          with ZipFile(target) as z:
            assert z.testzip() is None
            assert len(z.namelist())>=885
            assert 'astro_app/test/bnn_event_convergence_v371_test.dart' in z.namelist()
          with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write('APP_DIR='+str(app)+'\n')
          print('Source prepared:',target,'entries',len(ZipFile(target).namelist()))
          PY_BUILD

      - name: Upload v371 Full Flutter Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.371-FULL-SOURCE
          path: Annapurna-Astro-Vastu-v1.4.371-BNN-Event-Convergence-FULL.zip
          retention-days: 30
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter packages
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Run source, life events and BNN regression tests
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            test/bnn_event_convergence_v371_test.dart \
            test/bnn_life_event_evidence_gate_v370_test.dart \
            test/bnn_life_event_timing_v369_test.dart \
            test/bnn_jupiter_cycle_v355_test.dart \
            test/bnn_cycle_contact_results_v357_test.dart \
            test/bnn_cycle_result_highlight_v358_test.dart \
            test/bnn_planet_combinations_v359_test.dart \
            test/bnn_health_caution_v363_test.dart \
            test/bnn_mrityunjaya_remedy_v364_test.dart \
            test/bnn_multi_planet_source_v367_test.dart \
            test/bnn_progression_source_priority_v368_test.dart

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub 2>&1 | tee "${{ RUNNER_TEMP }}/bnn-v371-build.log"

      - name: Upload v371 installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.371-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostic log after a build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v371-Diagnostics
          path: ${{ runner.temp }}/bnn-v371-build.log
          retention-days: 14
          if-no-files-found: ignore
