      - name: Upload v370 Full Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.370-UI-FIX-FULL-SOURCE
          path: Annapurna-Astro-Vastu-v1.4.370-BNN-Life-Event-Evidence-Gate-UI-FIX-FULL.zip
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter packages
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Run event evidence gating and existing BNN regression tests
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            test/bnn_life_event_evidence_gate_v370_test.dart \
            test/bnn_life_event_timing_v369_test.dart \
            test/bnn_jupiter_cycle_v355_test.dart \
            test/bnn_cycle_contact_results_v357_test.dart \
            test/bnn_cycle_result_highlight_v358_test.dart \
            test/bnn_planet_combinations_v359_test.dart \
            test/bnn_health_caution_v363_test.dart \
            test/bnn_mrityunjaya_remedy_v364_test.dart \
            test/bnn_multi_planet_source_v367_test.dart \
            test/bnn_progression_source_priority_v368_test.dart

      - name: Build release APK only after tests pass
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            logfile="${RUNNER_TEMP}/bnn-v370-build-${attempt}.log"
            if flutter build apk --release --no-pub 2>&1 | tee "$logfile"; then
              echo 'v370 release APK SUCCESS'
              exit 0
            fi
            if ! grep -Eiq 'status code 403|403 Forbidden|Could not GET|Could not download|Read timed out|Connection reset|Temporary failure in name resolution|UnknownHostException' "$logfile"; then
              echo 'Non-transient build error; do not claim success'
              exit 1
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 20))"
          done

      - name: Upload v370 APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.370-UI-FIX-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v370-Diagnostics
          path: ${{ runner.temp }}/bnn-v370-build-*.log
          if-no-files-found: ignore
          retention-days: 14
