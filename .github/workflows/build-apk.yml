name: Build Annapurna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Annapurna-Astro-Vastu-v1.4-audited-fixed.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          mkdir -p appsrc
          unzip -q Annapurna-Astro-Vastu-v1.4-audited-fixed.zip -d appsrc

          PUBSPEC=$(find appsrc -type f -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix StringBuffer compile error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          f = Path(os.environ["PROJECT_DIR"]) / "lib/screens/event_timing_screen.dart"
          lines = f.read_text(encoding="utf-8").splitlines()

          for i, line in enumerate(lines):
              if "return StringBuffer()" in line:
                  lines[i] = line.replace(
                      "return StringBuffer()",
                      "return (StringBuffer()",
                      1
                  )

                  for j in range(i + 1, len(lines)):
                      if lines[j].rstrip().endswith(";"):
                          lines[j] = lines[j].rstrip()[:-1] + ").toString();"
                          break
                  break

          f.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-Astro-Vastu-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
