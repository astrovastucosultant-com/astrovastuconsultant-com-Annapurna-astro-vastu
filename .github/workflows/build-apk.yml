name: Build Annapurna APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional exact project ZIP filename; leave blank to use highest version'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SOURCE_ZIP: ${{ inputs.source_zip || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Flutter app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import os, re, stat, sys
          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          requested = os.environ.get('SOURCE_ZIP','').strip()
          candidates = []
          files = sorted(set(repo.glob('*.zip')) | set(repo.glob('*/*.zip')) | set(repo.glob('*/*/*.zip')))
          for archive in files:
              if archive.is_symlink():
                  continue
              try:
                  with ZipFile(archive) as z:
                      pubspecs = [n for n in z.namelist() if n == 'pubspec.yaml' or n == 'astro_app/pubspec.yaml' or n.endswith('/astro_app/pubspec.yaml')]
                      if len(pubspecs) != 1:
                          continue
                      match = re.search(r'^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?', z.read(pubspecs[0]).decode('utf-8'), re.M)
                      if not match:
                          continue
                      nums = tuple(int(v or 0) for v in match.groups())
                      candidates.append(((nums[3], nums[:3]), archive, pubspecs[0]))
              except (BadZipFile, UnicodeDecodeError, OSError):
                  continue
          if requested:
              chosen = [c for c in candidates if c[1].name == requested or str(c[1].relative_to(repo)) == requested]
              if len(chosen) != 1:
                  sys.exit(f'ERROR: Requested ZIP {requested!r} is missing or not unique.')
          elif candidates:
              latest = max(c[0] for c in candidates)
              chosen = [c for c in candidates if c[0] == latest]
              if len(chosen) != 1:
                  sys.exit('ERROR: Multiple archives have the same latest version; use source_zip.')
          else:
              chosen = []
          if chosen:
              _, archive, pubspec = chosen[0]
              print('Using:', archive.relative_to(repo))
              dest = repo / '_appsrc'
              dest.mkdir(exist_ok=True)
              with ZipFile(archive) as z:
                  if z.testzip() is not None:
                      sys.exit('ERROR: Damaged ZIP.')
                  if sum(x.file_size for x in z.infolist()) > 1_500_000_000:
                      sys.exit('ERROR: ZIP too large after extraction.')
                  for x in z.infolist():
                      path = PurePosixPath(x.filename)
                      if path.is_absolute() or '..' in path.parts or '\\' in x.filename or stat.S_ISLNK(x.external_attr >> 16):
                          sys.exit(f'ERROR: Unsafe ZIP path {x.filename!r}')
                  z.extractall(dest)
              project = dest / Path(pubspec).parent
          else:
              project = repo / 'astro_app' if (repo / 'astro_app/pubspec.yaml').is_file() else repo
          for name in ('pubspec.yaml','lib/main.dart','android/app/build.gradle.kts'):
              if not (project / name).is_file():
                  sys.exit(f'ERROR: Flutter file missing: {project / name}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'PROJECT_DIR={project}\n')
          print('Project:', project)
          PY

      - name: Normalize duplicate Flutter assets entries
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pubspec.yaml')
          lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
          starts=[i for i,line in enumerate(lines) if re.fullmatch(r'  assets:\s*',line.strip('\r\n'))]
          if len(starts)>1:
              collected=[]; seen=set(); remove=set()
              for pos in starts:
                  end=pos+1
                  while end<len(lines) and (lines[end].startswith('    - ') or not lines[end].strip()):
                      end+=1
                  remove.update(range(pos+1,end))
                  if pos!=starts[0]: remove.add(pos)
                  for item in lines[pos+1:end]:
                      if item.startswith('    - ') and item.strip() not in seen:
                          seen.add(item.strip()); collected.append(item)
              result=[]
              for i,line in enumerate(lines):
                  if i==starts[0]:
                      result.append(line);result.extend(collected)
                  elif i not in remove: result.append(line)
              p.write_text(''.join(result),encoding='utf-8')
              print('Assets normalized; items:',len(collected))
          PY

      - name: Verify D9 checklist integration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -f lib/screens/d9_marriage_43_checklist_screen.dart
          grep -Fq 'D9Marriage43ChecklistScreen' lib/screens/chart_screen.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle dependencies between runs
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK (retry transient Gradle or Maven errors)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            echo "::group::APK compilation attempt ${attempt}/4"
            log="${RUNNER_TEMP}/annapurna-build-attempt-${attempt}.log"
            if flutter build apk --release --no-pub 2>&1 | tee "$log"; then
              echo '::endgroup::'
              echo "APK build succeeded on attempt ${attempt}"
              exit 0
            fi
            echo '::endgroup::'
            if ! grep -Eiq 'status code 403|403 Forbidden|Could not GET|Could not download|Read timed out|Connection reset|Temporary failure in name resolution|UnknownHostException' "$log"; then
              echo '::error::Build failed with a non-network error; stopping retry.'
              exit 1
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo '::error::Maven/Gradle download failed after 4 attempts.'
              exit 1
            fi
            echo '::warning::Temporary Maven/Gradle download failure; retrying after backoff.'
            sleep "$((attempt * 20))"
          done

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-Astro-Vastu-D9-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed build diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-Gradle-Error-Logs
          path: ${{ runner.temp }}/annapurna-build-attempt-*.log
          if-no-files-found: ignore
          retention-days: 14
          
          
