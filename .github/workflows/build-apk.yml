name: Build Annapurna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Annapurna-Astro-Vastu-D9-Checklist-Entry-20261021.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found in repository root: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          unzip -tq "$ZIP_FILE"
          mkdir -p appsrc
          unzip -q "$ZIP_FILE" -d appsrc

          if [ ! -f appsrc/astro_app/pubspec.yaml ]; then
            echo "ERROR: Expected Flutter project not found at appsrc/astro_app"
            find appsrc -name pubspec.yaml -print
            exit 1
          fi

          echo "PROJECT_DIR=appsrc/astro_app" >> "$GITHUB_ENV"
          echo "Flutter project: appsrc/astro_app"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-Astro-Vastu-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
