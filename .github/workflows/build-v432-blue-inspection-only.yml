name: Build Annapurna v1.4.432 Inspection Blue Only APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v432-blue-inspection-only.yml'
      - 'Annapurna-v1.4.432-Blue-Inspection-Only-FULL.zip'

permissions:
  contents: read

concurrency:
  group: annapurna-v432-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v432:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Annapurna-v1.4.432-Blue-Inspection-Only-FULL.zip
          sparse-checkout-cone-mode: false

      - name: Verify source and extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          source = Path('Annapurna-v1.4.432-Blue-Inspection-Only-FULL.zip')
          assert source.is_file(), 'v431 FULL ZIP missing from repository root'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'b893cadf9763ece87e94d15574f8afea76efdb0d81abe13407a816d849a02c5d', 'v431 ZIP checksum mismatch'
          dest = Path(os.environ['RUNNER_TEMP']) / 'annapurna_v432'
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None, 'Corrupted archive'
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  assert p.parts and not p.is_absolute() and '..' not in p.parts, f'Unsafe ZIP path {info.filename}'
                  assert p.parts[0] == 'astro_app' or info.filename.startswith('README-'), info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16), info.filename
              z.extractall(dest)
          app = dest / 'astro_app'
          assert 'version: 1.4.431+431' in (app / 'pubspec.yaml').read_text()
          for name in [
              'lib/screens/birth_details_screen.dart',
              'lib/screens/chart_screen.dart',
              'lib/screens/question_place_picker.dart',
              'lib/services/question_place_service.dart',
              'test/question_place_default_v426_test.dart',
              'test/jamakola_pending_group_v427_test.dart',
              'test/jamakola_compact_review_v428_test.dart',
              'test/jamakola_result_order_v429_test.dart',
              'test/jamakola_kavippu_auto_contact_v430_test.dart',
              'test/jamakola_topic_isolation_v429_test.dart',
              'lib/screens/topic_inspection_headline_v431.dart',
              'lib/screens/topic_result_card_v391.dart',
              'lib/screens/topic_result_card_v398.dart',
              'test/topic_inspection_headline_v431_test.dart',
              'test/topic_result_card_v391_test.dart',
              'lib/screens/unified_prashna_screen.dart',
              'lib/screens/jamakola_rule_panel.dart',
              'lib/astrology/jamakola_rule_engine.dart',
              'android/app/annapurna-build11.jks',
          ]:
              assert (app / name).is_file(), name
          pub = app / 'pubspec.yaml'
          old = pub.read_text()
          assert 'version: 1.4.431+431' in old, 'Unexpected base version'
          pub.write_text(old.replace('version: 1.4.431+431', 'version: 1.4.432+432', 1))
          for new_file in [
              'lib/screens/rule_inspection_highlight_v432.dart',
              'test/rule_inspection_blue_only_v432_test.dart',
          ]:
              assert (app / new_file).is_file(), new_file
          print('v432 full source, rule inspection and tests verified')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter dependencies
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        run: flutter pub get

      - name: Register in-memory SharedPreferencesAsync for storage tests
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ASYNC_MOCK'
          from pathlib import Path

          pub = Path('pubspec.yaml')
          body = pub.read_text()
          needle = 'dev_dependencies:\n'
          assert body.count(needle) == 1
          assert 'shared_preferences_platform_interface:' not in body
          pub.write_text(body.replace(needle,
              'dev_dependencies:\n  shared_preferences_platform_interface: ^2.4.2\n', 1))

          imports = (
              "import 'package:shared_preferences_platform_interface/in_memory_shared_preferences_async.dart';\n"
              "import 'package:shared_preferences_platform_interface/shared_preferences_async_platform_interface.dart';\n"
          )
          mock_setup = '''  setUpAll(() {
              SharedPreferencesAsyncPlatform.instance = InMemorySharedPreferencesAsync.empty();
            });
            setUp(() async {
              SharedPreferences.setMockInitialValues({});
              await SharedPreferencesAsync().clear();
            });'''
          replacements = {
              'test/question_place_default_v426_test.dart':
                  '  setUp(() => SharedPreferences.setMockInitialValues({}));',
              'test/place_storage_service_test.dart':
                  '''  setUp(() {
              SharedPreferences.setMockInitialValues({});
            });''',
          }
          for filename, old in replacements.items():
              path = Path(filename)
              text = path.read_text()
              marker = "import 'package:shared_preferences/shared_preferences.dart';\n"
              assert text.count(marker) == 1, filename
              assert text.count(old) == 1, filename
              text = text.replace(marker, marker + imports, 1)
              path.write_text(text.replace(old, mock_setup, 1))
              print('Registered async preferences mock:', filename)
          PY_ASYNC_MOCK
          flutter pub get

      - name: Update v429 chart-order test for v430 Kavippu argument
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_TEST_FIX'
          from pathlib import Path
          p = Path('test/jamakola_result_order_v429_test.dart')
          src = p.read_text()
          old = '_decisionFacts(chart,special,ar,chatraSign,ch)'
          new = '_decisionFacts(chart,special,ar,chatraSign,effectiveKav)'
          assert src.count(old) == 1, 'Expected old test assertion not found'
          view = Path('lib/screens/jamakola_rule_panel.dart').read_text()
          start = view.index('Widget _selectedChart(')
          end = view.index('// On phones the planetary data', start)
          section = view[start:end]
          assert section.index('_JamakkolSouthChart(') < section.index(new) < section.index('_rulesPanel(chart,special)')
          p.write_text(src.replace(old, new, 1))
          print('Chart-first order validated, and regression test updated')
          PY_TEST_FIX

      - name: Repair v431 accordion regression test fixtures
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX_V431'
          from pathlib import Path
          import re

          def patch(root):
              # Fixture constructors must satisfy the required evidence contract.
              p=root/'test/topic_inspection_headline_v431_test.dart'
              s=p.read_text()
              count=[0]
              def add_details(m):
                  body=m.group(1)
                  if 'details:' not in body:
                      count[0]+=1
                      return 'TopicStageEvidence(details: \'\', '+body+')'
                  return m.group(0)
              s=re.sub(r'TopicStageEvidence\(([^)]*)\)', add_details, s, flags=re.S)
              assert count[0] == 7, f'Expected seven missing fixture details, got {count[0]}'
              old='await tester.ensureVisible(d1);'
              assert s.count(old)==1
              s=s.replace(old, "await tester.scrollUntilVisible(d1, 140, scrollable: find.byType(Scrollable).last);")
              old='await tester.ensureVisible(shared);'
              assert s.count(old)==1
              s=s.replace(old, "await tester.scrollUntilVisible(shared, 140, scrollable: find.byType(Scrollable).last);")
              p.write_text(s)

              # When detail cards are collapsed, scroll the modal list to reveal their keys.
              p=root/'test/topic_result_card_v391_test.dart'
              s=p.read_text()
              old='await tester.ensureVisible(d1);'
              assert s.count(old)==1
              s=s.replace(old,"await tester.scrollUntilVisible(d1, 140, scrollable: find.byType(Scrollable).last);")
              # The expanded sheet uses a lazy ListView: its off-screen
              # header may not be in the widget tree. Dismiss via Android
              # back (Navigator pop route) instead of assuming visible close.
              old="      await tester.ensureVisible(find.byTooltip('మూసివేయి'));\n      await tester.tap(find.byTooltip('మూసివేయి'));"
              assert s.count(old) == 1, 'Expected modal close fixture once'
              s=s.replace(old, "      await tester.binding.handlePopRoute();")
              p.write_text(s)

              # Newly implemented D6 graph must not count as a validated rule match.
              p=root/'test/topic_varga_review_panel_test.dart'
              s=p.read_text()
              old="    expect(find.textContaining('VARGA-CROSS-001'), findsWidgets);"
              new="    await tester.scrollUntilVisible(find.textContaining('చార్ట్ క్రమ మూలం: VARGA-CROSS-001'), 140, scrollable: find.byType(Scrollable).last);\n    expect(find.textContaining('చార్ట్ క్రమ మూలం: VARGA-CROSS-001'), findsOneWidget);"
              assert s.count(old)==1
              s=s.replace(old,new)
              old="    expect(find.textContaining('D6 — చక్రం అందుబాటులో లేదు'), findsOneWidget);\n    expect(find.textContaining('ఈ వర్గ గణన ఇంకా లేదు'), findsOneWidget);"
              new="    expect(find.textContaining('D6 — షష్ఠాంశ'), findsOneWidget);\n    expect(find.byKey(const ValueKey('topic-chart-VARGA-CROSS-007-6')), findsOneWidget);\n    expect(find.textContaining('ధృవీకరణ పెండింగ్'), findsWidgets);"
              assert s.count(old)==1
              s=s.replace(old,new)
              p.write_text(s)

              # Assertions test availability of expand/collapse, not hiding failures.
              assert 'testWidgets' in (root/'test/topic_result_card_v391_test.dart').read_text()
              print('Repaired three test fixture files without touching production lib/')

          patch(Path('.'))
          PY_FIX_V431

      - name: Fix v432 source compile and inspection Material widgets
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX_V432'
          from pathlib import Path
          
          varga = Path('lib/screens/topic_varga_review_panel.dart')
          code = varga.read_text(encoding='utf-8')
          old = "const Text(\n                '3. ఫలితం',"
          new = "Text(\n                '3. ఫలితం',"
          assert code.count(old) == 1, 'Unexpected v432 result-header source'
          varga.write_text(code.replace(old, new, 1), encoding='utf-8')
          
          inspection = Path('lib/screens/rule_inspection_highlight_v432.dart')
          code = inspection.read_text(encoding='utf-8')
          old = '''    return Container(
                margin: const EdgeInsets.symmetric(vertical: 5),
                decoration: BoxDecoration(color: inspectionBackground,
                  borderRadius: BorderRadius.circular(10),
                  border: Border.all(color: inspectionBlue.withOpacity(.45))),
                child: ExpansionTile('''
          new = '''    return Card(
                margin: const EdgeInsets.symmetric(vertical: 5),
                elevation: 0,
                color: inspectionBackground,
                clipBehavior: Clip.antiAlias,
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(10),
                  side: BorderSide(color: inspectionBlue.withOpacity(.45)),
                ),
                child: ExpansionTile('''
          assert code.count(old) == 1, 'Unexpected v432 inspection-card source'
          inspection.write_text(code.replace(old, new, 1), encoding='utf-8')
          print('Fixed v432 dynamic result ink and inspection Card Material painting')
          PY_FIX_V432

      - name: Verify two-tap inspection and scoped chart scroll regression tests
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX_V432_TESTS'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              assert s.count(old) == 1, f'Fixture differs: {path}; {old[:50]}'
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # There are now TWO collapsed layers: the varga headline, then the
          # blue inspection section.  Test that the second explicit tap
          # opens real chart details rather than disabling the regression.
          replace_exact(
              'test/topic_inspection_headline_v431_test.dart',
              "    expect(find.text('D1 inspection'), findsOneWidget);",
              "    final inspection = find.text('2. జాతక పరిశీలన');\n"
              "    await tester.ensureVisible(inspection);\n"
              "    await tester.tap(inspection);\n"
              "    await tester.pumpAndSettle();\n"
              "    expect(find.text('D1 inspection'), findsOneWidget);",
          )
          replace_exact(
              'test/topic_result_card_v391_test.dart',
              "      expect(find.text('D1 fixture inspection'), findsOneWidget);",
              "      final inspection = find.text('2. జాతక పరిశీలన');\n"
              "      await tester.ensureVisible(inspection);\n"
              "      await tester.tap(inspection);\n"
              "      await tester.pumpAndSettle();\n"
              "      expect(find.text('D1 fixture inspection'), findsOneWidget);",
          )

          # Verify the details remain collapsed until explicitly opened.
          # The source footer belongs to the MODAL ListView, not a 40-pixel
          # inner chart Scrollable.  Target that ListView's Scrollable.
          replace_exact(
              'test/topic_varga_review_panel_test.dart',
              "    expect(find.textContaining('D9 పూర్తి పరీక్ష లేదు'), findsOneWidget);\n"
              "    await tester.scrollUntilVisible(find.textContaining('చార్ట్ క్రమ మూలం: VARGA-CROSS-001'), 140, scrollable: find.byType(Scrollable).last);\n"
              "    expect(find.textContaining('చార్ట్ క్రమ మూలం: VARGA-CROSS-001'), findsOneWidget);",
              "    final inspection = find.text('2. జాతక పరిశీలన');\n"
              "    await tester.ensureVisible(inspection);\n"
              "    await tester.tap(inspection);\n"
              "    await tester.pumpAndSettle();\n"
              "    expect(find.textContaining('D9 పూర్తి పరీక్ష లేదు'), findsOneWidget);\n"
              "    final sheetScroll = find.descendant(\n"
              "      of: find.descendant(\n"
              "        of: find.byType(BottomSheet), matching: find.byType(ListView),\n"
              "      ).first,\n"
              "      matching: find.byType(Scrollable),\n"
              "    ).first;\n"
              "    await tester.scrollUntilVisible(\n"
              "      find.textContaining('చార్ట్ క్రమ మూలం: VARGA-CROSS-001'),\n"
              "      160, scrollable: sheetScroll,\n"
              "    );\n"
              "    expect(find.textContaining('చార్ట్ క్రమ మూలం: VARGA-CROSS-001'), findsOneWidget);",
          )

          # Source navigation still has to be exercised, not skipped.
          for test in ('topic_inspection_headline_v431_test.dart',
                       'topic_result_card_v391_test.dart',
                       'topic_varga_review_panel_test.dart'):
              src=Path('test')/test
              assert 'expect(' in src.read_text(encoding='utf-8')
          print('Real second-tap inspection and modal source scroll test fixtures updated')
          PY_FIX_V432_TESTS

      - name: Validate v432 inspection highlight, varga and Jamakola regressions
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        run: |
          flutter test --no-pub --reporter expanded \
            test/jamakola_compact_review_v428_test.dart \
            test/jamakola_result_order_v429_test.dart \
            test/jamakola_kavippu_auto_contact_v430_test.dart \
            test/jamakola_topic_isolation_v429_test.dart \
            test/jamakola_pending_group_v427_test.dart \
            test/jamakola_rule_facts_test.dart \
            test/question_place_default_v426_test.dart \
            test/home_kp_jamakola_v423_test.dart \
            test/place_storage_service_test.dart \
            test/topic_inspection_headline_v431_test.dart \
            test/rule_inspection_blue_only_v432_test.dart \
            test/topic_result_card_v391_test.dart \
            test/topic_varga_review_panel_test.dart \
            test/topic_results_v398_test.dart \
            test/marriage_four_chart_audit_v420_test.dart \
            test/career_options_card_v394_test.dart \
            test/wealth_topic_v409_test.dart

      - name: Build signed release APK
        working-directory: ${{ runner.temp }}/annapurna_v432/astro_app
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.432-Blue-Inspection-Only-APK
          path: ${{ runner.temp }}/annapurna_v432/astro_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
