
name: Build Annapurna v1.4.431 Varga Result Headline Accordion APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v431-varga-result-headlines.yml'
      - 'Annapurna-Astro-Vastu-v1.4.431-Varga-Result-Headline-Accordion-FULL.zip'

permissions:
  contents: read

concurrency:
  group: annapurna-v431-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v431:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Annapurna-Astro-Vastu-v1.4.431-Varga-Result-Headline-Accordion-FULL.zip
          sparse-checkout-cone-mode: false

      - name: Verify source and extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          source = Path('Annapurna-Astro-Vastu-v1.4.431-Varga-Result-Headline-Accordion-FULL.zip')
          assert source.is_file(), 'v431 FULL ZIP missing'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f9475ae7ee113ff7deff206ed396956da4588fed24b0d516ce71ef9a0e49c673', 'ZIP checksum mismatch'
          dest = Path(os.environ['RUNNER_TEMP']) / 'annapurna_v431'
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None, 'Corrupted ZIP'
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  assert p.parts and not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] == 'astro_app' or info.filename.startswith('README-')
                  assert not stat.S_ISLNK(info.external_attr >> 16)
              z.extractall(dest)
          app = dest / 'astro_app'
          assert 'version: 1.4.431+431' in (app / 'pubspec.yaml').read_text()
          for name in [
              'lib/screens/topic_inspection_headline_v431.dart',
              'lib/screens/topic_result_card_v391.dart',
              'lib/screens/topic_result_card_v398.dart',
              'test/topic_inspection_headline_v431_test.dart',
              'test/topic_result_card_v391_test.dart',
              'test/jamakola_kavippu_auto_contact_v430_test.dart',
              'test/jamakola_result_order_v429_test.dart',
              'android/app/annapurna-build11.jks',
          ]:
              assert (app / name).is_file(), name
          print('v431 source verified')
          PY_VERIFY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter dependencies
        working-directory: ${{ runner.temp }}/annapurna_v431/astro_app
        run: flutter pub get

      - name: Register SharedPreferencesAsync test mock
        working-directory: ${{ runner.temp }}/annapurna_v431/astro_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          assert 'shared_preferences_platform_interface:' not in s
          p.write_text(s.replace('dev_dependencies:\n', 'dev_dependencies:\n  shared_preferences_platform_interface: ^2.4.2\n', 1))
          imports = (
              "import 'package:shared_preferences_platform_interface/in_memory_shared_preferences_async.dart';\n"
              "import 'package:shared_preferences_platform_interface/shared_preferences_async_platform_interface.dart';\n"
          )
          setup = '''  setUpAll(() {
              SharedPreferencesAsyncPlatform.instance = InMemorySharedPreferencesAsync.empty();
            });
            setUp(() async {
              SharedPreferences.setMockInitialValues({});
              await SharedPreferencesAsync().clear();
            });'''
          replacements = {
              'test/question_place_default_v426_test.dart':
                  '  setUp(() => SharedPreferences.setMockInitialValues({}));',
              'test/place_storage_service_test.dart':
                  '''  setUp(() {
              SharedPreferences.setMockInitialValues({});
            });''',
          }
          for filename, old in replacements.items():
              p = Path(filename)
              s = p.read_text()
              marker = "import 'package:shared_preferences/shared_preferences.dart';\n"
              assert s.count(marker) == 1
              assert s.count(old) == 1
              p.write_text(s.replace(marker, marker + imports, 1).replace(old, setup, 1))
          PY
          flutter pub get

      - name: Update chart-order regression test
        working-directory: ${{ runner.temp }}/annapurna_v431/astro_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/jamakola_result_order_v429_test.dart')
          s = p.read_text()
          old = '_decisionFacts(chart,special,ar,chatraSign,ch)'
          new = '_decisionFacts(chart,special,ar,chatraSign,effectiveKav)'
          assert s.count(old) == 1
          view = Path('lib/screens/jamakola_rule_panel.dart').read_text()
          start = view.index('Widget _selectedChart(')
          end = view.index('// On phones the planetary data', start)
          section = view[start:end]
          assert section.index('_JamakkolSouthChart(') < section.index(new) < section.index('_rulesPanel(chart,special)')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Run Flutter tests
        working-directory: ${{ runner.temp }}/annapurna_v431/astro_app
        run: |
          flutter test --no-pub --reporter expanded \
            test/topic_inspection_headline_v431_test.dart \
            test/topic_result_card_v391_test.dart \
            test/topic_varga_review_panel_test.dart \
            test/topic_results_v398_test.dart \
            test/jamakola_compact_review_v428_test.dart \
            test/jamakola_result_order_v429_test.dart \
            test/jamakola_kavippu_auto_contact_v430_test.dart \
            test/jamakola_topic_isolation_v429_test.dart \
            test/jamakola_pending_group_v427_test.dart \
            test/jamakola_rule_facts_test.dart \
            test/question_place_default_v426_test.dart \
            test/home_kp_jamakola_v423_test.dart \
            test/place_storage_service_test.dart \
            test/marriage_four_chart_audit_v420_test.dart \
            test/career_options_card_v394_test.dart \
            test/wealth_topic_v409_test.dart

      - name: Build release APK
        working-directory: ${{ runner.temp }}/annapurna_v431/astro_app
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.431-Varga-Result-Headline-Accordion-APK
          path: ${{ runner.temp }}/annapurna_v431/astro_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
