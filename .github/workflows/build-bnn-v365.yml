      - name: Upload FULL Flutter Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.365-FULL-SOURCE
          path: ${{ env.FULL_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Extract complete project for compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,stat
          from pathlib import Path,PurePosixPath
          archive=Path(os.environ['FULL_ZIP'])
          target=Path(os.environ['RUNNER_TEMP'])/'annapurna_v364'
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p=PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in item.filename
                  assert not stat.S_ISLNK(item.external_attr >> 16)
              z.extractall(target)
          pubspecs=[p for p in target.rglob('pubspec.yaml') if (p.parent/'lib/main.dart').exists()]
          assert len(pubspecs)==1, pubspecs
          project=pubspecs[0].parent
          for rel in ('lib/main.dart','android/app/build.gradle.kts','lib/screens/d9_marriage_43_checklist_screen.dart'):
              assert (project/rel).is_file(), rel
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'PROJECT_DIR={project}\n')
          print('Build project:',project)
          PY

      - name: Check D9 checklist and normalize Flutter assets
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          grep -Fq 'D9Marriage43ChecklistScreen' lib/screens/chart_screen.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pubspec.yaml')
          lines=p.read_text(encoding='utf8').splitlines(keepends=True)
          starts=[i for i,line in enumerate(lines) if re.fullmatch(r'  assets:\s*',line.strip('\r\n'))]
          if len(starts)>1:
              collected=[]; seen=set(); remove=set()
              for pos in starts:
                  end=pos+1
                  while end<len(lines) and (lines[end].startswith('    - ') or not lines[end].strip()):
                      end+=1
                  remove.update(range(pos+1,end))
                  if pos!=starts[0]: remove.add(pos)
                  for item in lines[pos+1:end]:
                      if item.startswith('    - ') and item.strip() not in seen:
                          seen.add(item.strip()); collected.append(item)
              result=[]
              for i,line in enumerate(lines):
                  if i==starts[0]: result.append(line);result.extend(collected)
                  elif i not in remove: result.append(line)
              p.write_text(''.join(result),encoding='utf8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Test BNN v365 combination UI, source rules, and remedy safeguards
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter test test/bnn_planet_combinations_v359_test.dart test/bnn_health_caution_v363_test.dart test/bnn_mrityunjaya_remedy_v364_test.dart

      - name: Build release APK (retry transient network failures)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            log="${RUNNER_TEMP}/bnn-v364-build-${attempt}.log"
            if flutter build apk --release --no-pub 2>&1 | tee "$log"; then
              echo 'v364 release APK compilation succeeded'
              exit 0
            fi
            if ! grep -Eiq 'status code 403|403 Forbidden|Could not GET|Could not download|Read timed out|Connection reset|Temporary failure in name resolution|UnknownHostException' "$log"; then
              echo '::error::Non-network build failure, stopping.'
              exit 1
            fi
            if [[ "$attempt" -eq 4 ]]; then exit 1; fi
            sleep "$((attempt * 20))"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.365-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v365-Build-Diagnostics
          path: ${{ runner.temp }}/bnn-v364-build-*.log
          if-no-files-found: ignore
          retention-days: 14
