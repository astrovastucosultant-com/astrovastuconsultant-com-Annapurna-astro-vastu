          """
          patch=base64.b64decode(''.join(encoded.split()))
          assert hashlib.sha256(patch).hexdigest()=='f024ce6e86617f5c2c24b993bafc9b99ddcadd72554104c6cd59c200655e8d4b', 'Overlay digest mismatch'
          entries={}
          for raw in (source.read_bytes(),patch):
            with ZipFile(io.BytesIO(raw)) as archive:
              assert archive.testzip() is None, 'Corrupt zip'
              for obj in archive.infolist():
                path=PurePosixPath(obj.filename)
                assert not path.is_absolute() and '..' not in path.parts and path.parts[0]=='astro_app'
                assert not stat.S_ISLNK(obj.external_attr>>16)
                if obj.is_dir(): continue
                entries[obj.filename]=archive.read(obj)
          assert len(entries)>880
          assert b'version: 1.4.373+373' in entries['astro_app/pubspec.yaml']
          assert 'astro_app/test/bnn_font_size_v372_test.dart' in entries
          assert 'astro_app/test/bnn_transit_sampling_v372_test.dart' in entries
          assert 'astro_app/test/bnn_font_ui_v372_test.dart' in entries
          assert 'astro_app/lib/settings/app_font_size_controls.dart' in entries
          assert 'astro_app/lib/astrology/bnn_financial_evidence_v373.dart' in entries
          out=root/'Annapurna-Astro-Vastu-v1.4.373-BNN-Financial-Rule-Evidence-FULL.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6) as archive:
            for name,data in sorted(entries.items()):
              info=ZipInfo(name)
              info.compress_type=ZIP_DEFLATED
              info.external_attr=((0o100755 if name.endswith('/gradlew') else 0o100644)<<16)
              archive.writestr(info,data,compress_type=ZIP_DEFLATED,compresslevel=6)
          with ZipFile(out) as zip:
            assert zip.testzip() is None
          workspace=Path(os.environ['RUNNER_TEMP'])/'annapurna_v373'
          for name,data in entries.items():
            f=workspace/name
            f.parent.mkdir(parents=True,exist_ok=True)
            f.write_bytes(data)
          app=workspace/'astro_app'
          (app/'android/gradlew').chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write('APP_DIR='+str(app)+'\n')
          print('Prepared v373 source:',out, 'entries',len(entries), 'patch rows', 25)
          PY_BUILD

      - name: Upload v373 Full Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.373-FULL-SOURCE
          path: Annapurna-Astro-Vastu-v1.4.373-BNN-Financial-Rule-Evidence-FULL.zip
          retention-days: 30
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter packages
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Verify financial evidence rules
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/verify_financial_v373.dart

      - name: Test financial cards, D2 and BNN regression
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            test/bnn_financial_ui_v373_test.dart \
            test/d2_wealth_evaluation_service_test.dart \
            test/d2_rule_conflict_service_test.dart \
            test/bnn_font_size_v372_test.dart \
            test/bnn_font_ui_v372_test.dart \
            test/bnn_transit_sampling_v372_test.dart \
            test/bnn_event_convergence_v371_test.dart \
            test/bnn_life_event_evidence_gate_v370_test.dart \
            test/bnn_life_event_timing_v369_test.dart \
            test/bnn_jupiter_cycle_v355_test.dart \
            test/bnn_cycle_contact_results_v357_test.dart \
            test/bnn_cycle_result_highlight_v358_test.dart \
            test/bnn_planet_combinations_v359_test.dart \
            test/bnn_health_caution_v363_test.dart \
            test/bnn_mrityunjaya_remedy_v364_test.dart \
            test/bnn_multi_planet_source_v367_test.dart \
            test/bnn_progression_source_priority_v368_test.dart

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub 2>&1 | tee "${{ runner.temp }}/bnn-v373-build.log"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.373-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.373-Diagnostics
          path: ${{ runner.temp }}/bnn-v373-build.log
          retention-days: 14
          if-no-files-found: ignore
