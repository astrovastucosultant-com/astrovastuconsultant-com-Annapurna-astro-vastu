name: Build Annapurna APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-annapurna*.yml'
      - 'Annapurna-v1.4.375-Goel-Transit-Delivery.zip'

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout existing Annapurna source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            Annapurna-v1.4.375-Goel-Transit-Delivery.zip
          sparse-checkout-cone-mode: false

      - name: Select changed workflow
        id: workflow_guard
        shell: bash
        run: |
          python3 - <<'PY_GUARD'
          import os, subprocess
          from pathlib import Path
          ref = os.environ['GITHUB_WORKFLOW_REF']
          workflow_path = '.github/workflows/' + ref.split('/.github/workflows/', 1)[1].split('@', 1)[0]
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              build = True
          else:
              try:
                  changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
                  build = workflow_path in changed or 'Annapurna-v1.4.375-Goel-Transit-Delivery.zip' in changed
              except subprocess.CalledProcessError:
                  build = True
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('build=' + str(build).lower() + '\n')
          print('Build selected uploaded workflow.' if build else 'This older workflow was not changed; skipping duplicate build.')
          PY_GUARD

      - name: Verify v375 baseline and apply v404 per-chart body-region lists
        if: steps.workflow_guard.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          import hashlib, os, stat, base64, lzma
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from io import BytesIO
          root = Path(os.environ['GITHUB_WORKSPACE'])
          delivery = root / 'Annapurna-v1.4.375-Goel-Transit-Delivery.zip'
          if not delivery.is_file():
              raise SystemExit('Upload Annapurna-v1.4.375-Goel-Transit-Delivery.zip to repository root first')
          payload = delivery.read_bytes()
          assert hashlib.sha256(payload).hexdigest() == '70abaa40200290b79bb08cc0a9952a74fe8d1b63307a6a75a85c7a6845daddbc', 'Delivery ZIP checksum mismatch'
          with ZipFile(BytesIO(payload)) as package:
              assert package.testzip() is None, 'Corrupt delivery ZIP'
              source_bytes = package.read('Annapurna-Astro-Vastu-v1.4.375-Goel-Transit-FULL.zip')
          assert hashlib.sha256(source_bytes).hexdigest() == 'd97152b99daef2f811d07b8a992de7bbccc1e6048f2defb54c3429cd8cd9a736', 'Inner source ZIP checksum mismatch'
          source = root / 'Annapurna-Astro-Vastu-v1.4.375-Goel-Transit-FULL.zip'
          source.write_bytes(source_bytes)
          workspace = Path(os.environ['RUNNER_TEMP']) / 'annapurna_v404'
          with ZipFile(source) as archive:
              assert archive.testzip() is None, 'Corrupt source ZIP'
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts and path.parts[0] == 'astro_app'
                  assert not stat.S_ISLNK(item.external_attr >> 16)
              assert b'version: 1.4.375+375' in archive.read('astro_app/pubspec.yaml')
              archive.extractall(workspace)
          app = workspace / 'astro_app'
          patch = lzma.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == 'ad21348a8f5351b353b559a86f1215b8b73737b9b1d3a73414885977c089065f', 'Update payload checksum mismatch'
          with ZipFile(BytesIO(patch)) as update:
              assert update.testzip() is None
              for item in update.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] == 'astro_app'
                  assert not stat.S_ISLNK(item.external_attr >> 16)
              update.extractall(workspace)
          assert b'version: 1.4.404+404' in (app / 'pubspec.yaml').read_bytes()
          assert 'BnnUnifiedEvidencePanel376(' in (app / 'lib/screens/bnn_master_panel.dart').read_text()
          source = root / 'Annapurna-Astro-Vastu-v1.4.404-Planet-Results-FULL.zip'
          with ZipFile(source, 'w', compression=8, compresslevel=9) as complete:
              for item in sorted(app.rglob('*')):
                  if item.is_file() and not any(part in {'.git', '.dart_tool', 'build', '__pycache__'} for part in item.relative_to(app).parts):
                      complete.write(item, 'astro_app/' + str(item.relative_to(app)))
          (app / 'android/gradlew').chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APP_DIR=' + str(app) + '\n')
          print('Verified v404 source-linked topic results (v375 baseline)')
          PY_SOURCE

      - name: Upload v404 Full Source ZIP
        if: steps.workflow_guard.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.404-FULL-SOURCE
          path: Annapurna-Astro-Vastu-v1.4.404-Planet-Results-FULL.zip
          retention-days: 30
          if-no-files-found: error

      - name: Set up Java 17
        if: steps.workflow_guard.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        if: steps.workflow_guard.outputs.build == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle
        if: steps.workflow_guard.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Flutter packages
        if: steps.workflow_guard.outputs.build == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Verify source-linked rules and regressions
        if: steps.workflow_guard.outputs.build == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart run tool/verify_financial_v373.dart
          dart run tool/verify_financial_timing_v374.dart
          dart run tool/verify_goel_transit_v375.dart
          dart run tool/verify_bnn_unified_v376.dart
          dart run tool/verify_bnn_topic_search_v377.dart
          dart run tool/verify_bnn_safalya_v379.dart
          dart run tool/verify_bnn_auto_v381.dart
          dart run tool/verify_saturn_round_catalog_v382.dart
          dart run tool/verify_av_topic_v387.dart
          dart run tool/verify_marriage_combined_v390.dart
          dart run tool/verify_source_topics_v393.dart
          dart run tool/verify_career_options_v394.dart
          dart run tool/verify_education_result_v395.dart
          dart run tool/verify_property_result_v396.dart
          dart run tool/verify_marital_stability_v397.dart
          dart run tool/verify_topic_results_v398.dart
          dart run tool/verify_health_body_areas_v404.dart
          dart run tool/verify_health_topic_v402.dart
          dart run tool/verify_spiritual_topic_v403.dart

      - name: Test topic cards, source rules and regressions
        if: steps.workflow_guard.outputs.build == 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded \
            test/jamakola_subject_indicators_test.dart \
            test/jamakola_nimitta_300_test.dart \
            test/jamakola_rule_facts_test.dart \
            test/jamakola_special_service_test.dart \
            test/spiritual_topic_v403_test.dart \
            test/health_body_areas_v404_test.dart \
            test/health_topic_v402_test.dart \
            test/topic_results_v398_test.dart \
            test/marital_stability_v397_test.dart \
            test/marriage_chrome_if_then_test.dart \
            test/property_result_v396_test.dart \
            test/d12_kl_service_test.dart \
            test/education_result_v395_test.dart \
            test/career_options_card_v394_test.dart \
            test/source_topic_bridge_v393_test.dart \
            test/topic_chart_results_v392_test.dart \
            test/topic_result_card_v391_test.dart \
            test/marriage_combined_panel_v390_test.dart \
            test/av_topic_panel_v387_test.dart \
            test/ashtakavarga_service_test.dart \
            test/jaimini_chart_v386_test.dart \
            test/bnn_planet_positions_results_v383_test.dart \
            test/bnn_saturn_round_info_v382_test.dart \
            test/bnn_saturn_cycles_v356_test.dart \
            test/bnn_auto_source_pipeline_v381_test.dart \
            test/bnn_safalya_ui_v379_test.dart \
            test/bnn_topic_search_ui_v377_test.dart \
            test/bnn_unified_evidence_ui_v376_test.dart \
            test/bcp_master_engine_test.dart \
            test/bsp_service_test.dart \
            test/goel_transit_support_ui_v375_test.dart \
            test/bnn_financial_timing_ui_v374_test.dart \
            test/bnn_financial_ui_v373_test.dart \
            test/d2_wealth_evaluation_service_test.dart \
            test/d2_rule_conflict_service_test.dart \
            test/bnn_font_size_v372_test.dart \
            test/bnn_font_ui_v372_test.dart \
            test/bnn_transit_sampling_v372_test.dart \
            test/bnn_event_convergence_v371_test.dart \
            test/bnn_life_event_evidence_gate_v370_test.dart \
            test/bnn_life_event_timing_v369_test.dart \
            test/bnn_jupiter_cycle_v355_test.dart \
            test/bnn_cycle_contact_results_v357_test.dart \
            test/bnn_cycle_result_highlight_v358_test.dart \
            test/bnn_planet_combinations_v359_test.dart \
            test/bnn_health_caution_v363_test.dart \
            test/bnn_mrityunjaya_remedy_v364_test.dart \
            test/bnn_multi_planet_source_v367_test.dart \
            test/bnn_progression_source_priority_v368_test.dart 2>&1 | tee "${{ runner.temp }}/bnn-v404-tests.log"

      - name: Build release APK
        if: steps.workflow_guard.outputs.build == 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub 2>&1 | tee "${{ runner.temp }}/bnn-v404-build.log"

      - name: Upload installable APK
        if: steps.workflow_guard.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.404-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics if failed
        if: steps.workflow_guard.outputs.build == 'true' && (failure())
        uses: actions/upload-artifact@v4
        with:
          name: Annapurna-v1.4.404-Diagnostics
          path: |
            ${{ runner.temp }}/bnn-v404-build.log
            ${{ runner.temp }}/bnn-v404-tests.log
          retention-days: 14
          if-no-files-found: ignore





